<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables CSS Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #dbeafe);
            color: #0f172a;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        table {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 0.9rem 1rem;
            text-align: left;
        }

        th {
            background: #2563eb;
            color: white;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: #dbeafe;
        }
    </style>
</head>
<body>
    <h1>Student Schedule</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Course</th>
                <th>Time</th>
                <th>Room</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ava</td>
                <td>Web Design</td>
                <td>9:00 AM</td>
                <td>Room 204</td>
            </tr>
            <tr>
                <td>Marcus</td>
                <td>JavaScript</td>
                <td>10:30 AM</td>
                <td>Room 118</td>
            </tr>
            <tr>
                <td>Sophia</td>
                <td>Database</td>
                <td>1:00 PM</td>
                <td>Room 302</td>
            </tr>
            <tr>
                <td>Liam</td>
                <td>Computer Science</td>
                <td>2:30 PM</td>
                <td>Room 410</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
